<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- GlowFit Play feature graphic (1024x500, Play's required size).
       Brand colors from src/index.css; dark theme matches build-store-assets.cjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120A24"/>
      <stop offset="0.45" stop-color="#1A102F"/>
      <stop offset="1" stop-color="#2C1748"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#28D9F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#28D9F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F569B8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F569B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CE88F7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#CE88F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#9EEDFF"/>
      <stop offset="1" stop-color="#28D9F1"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.38" stop-color="#8B5CF6"/>
      <stop offset="0.68" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.45" stop-color="#CE88F7"/>
      <stop offset="0.75" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>
    <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#28D9F1"/>
    </linearGradient>
    <linearGradient id="starG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="star" d="M0,-24 L5.72,-7.91 L22.81,-7.41 L9.29,3.02 L14.10,19.35 L0,9.76 L-14.10,19.35 L-9.29,3.02 L-22.81,-7.41 L-5.72,-7.91 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <ellipse cx="790" cy="230" rx="380" ry="330" fill="url(#glowViolet)"/>
  <ellipse cx="140" cy="60" rx="320" ry="240" fill="url(#glowCyan)"/>
  <ellipse cx="620" cy="480" rx="360" ry="220" fill="url(#glowPink)"/>

  <!-- Left: wordmark + tagline + underline sweep -->
  <g filter="url(#textGlow)">
    <text x="72" y="215"
          font-family="Inter, 'Segoe UI', system-ui, sans-serif"
          font-size="92" font-weight="800" letter-spacing="4"
          fill="url(#word)">GLOW FIT</text>
  </g>
  <text x="74" y="268"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="26" font-weight="600" letter-spacing="6"
        fill="#CE88F7">WORKOUT. SHINE. THRIVE.</text>
  <rect x="74" y="296" width="330" height="6" rx="3" fill="url(#sweep)"/>

  <!-- Feature pills -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif"
     font-size="21" font-weight="600" fill="#E9DDFB">
    <rect x="74" y="344" width="150" height="52" rx="26"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.22)"/>
    <text x="149" y="377" text-anchor="middle">Workouts</text>

    <rect x="240" y="344" width="152" height="52" rx="26"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.22)"/>
    <text x="316" y="377" text-anchor="middle">Nutrition</text>

    <rect x="408" y="344" width="150" height="52" rx="26"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.22)"/>
    <text x="483" y="377" text-anchor="middle">Progress</text>

    <rect x="74" y="412" width="140" height="52" rx="26"
          fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.22)"/>
    <text x="144" y="445" text-anchor="middle">AI Coach</text>
  </g>

  <!-- Right: the mark, floating (no tile) -->
  <g transform="translate(772,250) scale(1.55) translate(-256,-230)">
    <path d="M 366.9 189.6 A 118 118 0 1 1 296.3 120.1"
          fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round"
          filter="url(#neon)"/>
    <circle cx="247" cy="155" r="15" fill="url(#headG)" filter="url(#neonSoft)"/>
    <g filter="url(#neonSoft)">
      <path d="M 232 178 C 218 235, 242 292, 292 326 C 266 288, 252 243, 262 182 Z"
            fill="url(#blade)"/>
      <path d="M 244 246 C 228 276, 214 300, 202 320 C 226 314, 246 290, 258 264 Z"
            fill="url(#leg)"/>
    </g>
    <path d="M 268 232 C 292 212, 316 184, 336 152"
          fill="none" stroke="url(#orbit)" stroke-width="9" stroke-linecap="round"
          filter="url(#neonSoft)"/>
    <g transform="translate(344 122) scale(1.05)" filter="url(#neon)">
      <use href="#star" fill="url(#starG)"/>
      <use href="#star" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
    </g>
  </g>
</svg>

