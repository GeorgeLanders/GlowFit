<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GlowFit logo — colors from src/index.css:
       cyan #28D9F1, lavender #CE88F7, pink #F569B8, magenta #C026D3,
       violet #7C3AED, dark #1A102F. Style: dark tile, broken neon orbit,
       swoosh runner + star. -->
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241543"/>
      <stop offset="0.55" stop-color="#1A102F"/>
      <stop offset="1" stop-color="#100A1F"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#CE88F7" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.45" stop-color="#CE88F7"/>
      <stop offset="0.75" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>

    <linearGradient id="blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>

    <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#28D9F1"/>
    </linearGradient>

    <linearGradient id="starG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#9EEDFF"/>
      <stop offset="1" stop-color="#28D9F1"/>
    </linearGradient>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="star" d="M0,-24 L5.72,-7.91 L22.81,-7.41 L9.29,3.02 L14.10,19.35 L0,9.76 L-14.10,19.35 L-9.29,3.02 L-22.81,-7.41 L-5.72,-7.91 Z"/>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#tileBg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none"
        stroke="#CE88F7" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="7" y="7" width="498" height="498" rx="106" fill="none"
        stroke="#28D9F1" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Broken orbit ring (gap at top-right for the star) -->
  <g filter="url(#neon)">
    <path d="M 366.9 189.6 A 118 118 0 1 1 296.3 120.1"
          fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Runner: head + tapered torso crescent + kicking leg crescent -->
  <circle cx="247" cy="155" r="15" fill="url(#headG)" filter="url(#neonSoft)"/>

  <g filter="url(#neonSoft)">
    <!-- torso: shoulders curving down to a pointed front foot -->
    <path d="M 232 178 C 218 235, 242 292, 292 326 C 266 288, 252 243, 262 182 Z"
          fill="url(#blade)"/>
    <!-- rear leg kicking to lower-left, tapering to a point -->
    <path d="M 244 246 C 228 276, 214 300, 202 320 C 226 314, 246 290, 258 264 Z"
          fill="url(#leg)"/>
  </g>

  <!-- arm / comet trail reaching up to the star -->
  <path d="M 268 232 C 292 212, 316 184, 336 152"
        fill="none" stroke="url(#orbit)" stroke-width="9" stroke-linecap="round"
        filter="url(#neonSoft)"/>

  <!-- star in the ring gap -->
  <g transform="translate(344 122) scale(1.05)" filter="url(#neon)">
    <use href="#star" fill="url(#starG)"/>
    <use href="#star" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <g filter="url(#textGlow)">
    <text x="256" y="420" text-anchor="middle"
          font-family="Inter, 'Segoe UI', system-ui, sans-serif"
          font-size="62" font-weight="800" letter-spacing="6"
          fill="url(#word)">GLOW FIT</text>
  </g>
  <text x="256" y="456" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="17" font-weight="600" letter-spacing="5"
        fill="#CE88F7">WORKOUT. SHINE. THRIVE.</text>
</svg>

