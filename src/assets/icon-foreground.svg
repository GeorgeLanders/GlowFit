<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F2"/>
    </linearGradient>
    <linearGradient id="fgCenter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="fgInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="fgOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <filter id="fringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="fpetal" d="M 0 0 C -42 -60, -42 -140, 0 -190 C 42 -140, 42 -60, 0 0 Z"/>
  </defs>

  <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <circle cx="256" cy="256" r="196" fill="none" stroke="url(#fring)" stroke-width="14" filter="url(#fringGlow)"/>
    <g transform="translate(256,372)">
      <use href="#fpetal" transform="rotate(-64) scale(0.85)" fill="url(#fgOuter)"/>
      <use href="#fpetal" transform="rotate(64) scale(0.85)" fill="url(#fgOuter)"/>
      <use href="#fpetal" transform="rotate(-32)" fill="url(#fgInner)"/>
      <use href="#fpetal" transform="rotate(32)" fill="url(#fgInner)"/>
      <use href="#fpetal" fill="url(#fgCenter)"/>
    </g>
  </g>
</svg>
