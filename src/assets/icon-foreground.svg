<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- GlowFit adaptive-icon foreground: transparent, mark only, scaled to 0.78
       so the star (furthest point, ~204px from center) stays inside the 169px
       Android adaptive safe circle. Tile/background comes from the background
       layer, not here. -->
  <defs>
    <linearGradient id="forbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.45" stop-color="#CE88F7"/>
      <stop offset="0.75" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>
    <linearGradient id="fblade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28D9F1"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="fleg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C026D3"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>
    <linearGradient id="fheadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#28D9F1"/>
    </linearGradient>
    <linearGradient id="fstarG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#8AF0FF"/>
      <stop offset="1" stop-color="#F569B8"/>
    </linearGradient>
    <filter id="fneon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fneonSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="fstar" d="M0,-24 L5.72,-7.91 L22.81,-7.41 L9.29,3.02 L14.10,19.35 L0,9.76 L-14.10,19.35 L-9.29,3.02 L-22.81,-7.41 L-5.72,-7.91 Z"/>
  </defs>

  <g transform="translate(0,26) translate(256,230) scale(1.25) translate(-256,-230)
                translate(256,256) scale(0.78) translate(-256,-256)">
    <path d="M 366.9 189.6 A 118 118 0 1 1 296.3 120.1"
          fill="none" stroke="url(#forbit)" stroke-width="15" stroke-linecap="round"
          filter="url(#fneon)"/>
    <circle cx="247" cy="155" r="15" fill="url(#fheadG)" filter="url(#fneonSoft)"/>
    <g filter="url(#fneonSoft)">
      <path d="M 232 178 C 218 235, 242 292, 292 326 C 266 288, 252 243, 262 182 Z"
            fill="url(#fblade)"/>
      <path d="M 244 246 C 228 276, 214 300, 202 320 C 226 314, 246 290, 258 264 Z"
            fill="url(#fleg)"/>
    </g>
    <path d="M 268 232 C 292 212, 316 184, 336 152"
          fill="none" stroke="url(#forbit)" stroke-width="9" stroke-linecap="round"
          filter="url(#fneonSoft)"/>
    <g transform="translate(344 122) scale(1.05)" filter="url(#fneon)">
      <use href="#fstar" fill="url(#fstarG)"/>
      <use href="#fstar" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
    </g>
  </g>
</svg>
