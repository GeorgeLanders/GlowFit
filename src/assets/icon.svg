<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B2A"/>
      <stop offset="1" stop-color="#060D16"/>
    </linearGradient>
    <linearGradient id="lring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F2"/>
    </linearGradient>
    <linearGradient id="gCenter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <radialGradient id="lhalo" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="lringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="petal" d="M 0 0 C -42 -60, -42 -140, 0 -190 C 42 -140, 42 -60, 0 0 Z"/>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#lbg)"/>
  <rect width="512" height="512" rx="112" fill="url(#lhalo)"/>

  <!-- Neon ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#lring)" stroke-width="12" filter="url(#lringGlow)"/>

  <!-- Lotus -->
  <g transform="translate(256,372)">
    <use href="#petal" transform="rotate(-64) scale(0.85)" fill="url(#gOuter)"/>
    <use href="#petal" transform="rotate(64) scale(0.85)" fill="url(#gOuter)"/>
    <use href="#petal" transform="rotate(-32)" fill="url(#gInner)"/>
    <use href="#petal" transform="rotate(32)" fill="url(#gInner)"/>
    <use href="#petal" fill="url(#gCenter)"/>
  </g>
</svg>
