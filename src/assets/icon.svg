<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle glow overlay -->
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>
  
  <!-- Dumbbell bar -->
  <rect x="130" y="240" width="252" height="32" rx="16" fill="white" opacity="0.95"/>
  
  <!-- Left weight plate - outer -->
  <rect x="80" y="178" width="70" height="156" rx="18" fill="white" opacity="0.95"/>
  <!-- Left weight plate - inner -->
  <rect x="100" y="200" width="46" height="112" rx="12" fill="white" opacity="0.7"/>
  
  <!-- Right weight plate - outer -->
  <rect x="362" y="178" width="70" height="156" rx="18" fill="white" opacity="0.95"/>
  <!-- Right weight plate - inner -->
  <rect x="366" y="200" width="46" height="112" rx="12" fill="white" opacity="0.7"/>
  
  <!-- Sparkle top-right -->
  <g transform="translate(380, 120)" filter="url(#innerGlow)">
    <polygon points="0,-28 6,-6 28,0 6,6 0,28 -6,6 -28,0 -6,-6" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
  </g>
  
  <!-- Sparkle top-left small -->
  <g transform="translate(120, 140) scale(0.5)">
    <polygon points="0,-20 4,-4 20,0 4,4 0,20 -4,4 -20,0 -4,-4" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Sparkle bottom -->
  <g transform="translate(340, 380) scale(0.6)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Glow circle behind dumbbell -->
  <ellipse cx="256" cy="256" rx="120" ry="60" fill="white" opacity="0.08"/>
  
  <!-- Small dots for sparkle effect -->
  <circle cx="160" cy="160" r="3" fill="white" opacity="0.5"/>
  <circle cx="400" cy="340" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="350" cy="130" r="2" fill="white" opacity="0.3"/>
</svg>
